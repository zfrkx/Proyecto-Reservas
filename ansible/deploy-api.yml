---
- name: Configurar API Gateway (app-api) como Proxy Inverso
  hosts: app-api
  become: yes

  tasks:
    - name: Instalar el servidor web Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Configurar Nginx como Proxy Inverso hacia app-core (Solo IPv4)
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://10.10.0.96:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Asegurar que el sitio default esté habilitado en sites-enabled
      ansible.builtin.file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link

    - name: Validar la sintaxis de configuración de Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Forzar la limpieza de procesos colgados usando Systemd
      ansible.builtin.command: systemctl kill nginx
      failed_when: false
      changed_when: false

    - name: Asegurar que Nginx esté encendido y habilitado
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes
